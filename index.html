<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c4e">
  <link rel="icon" href="data:,">
  <title>De Driekleur Business Suite</title>
  <script type="module" src="/src/app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Naar inhoud</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="branding" href="#dashboard">
        <span class="wordmark-icon" aria-hidden="true"></span>
        <span><strong>De Driekleur <em>Ede</em></strong><small>Business Suite</small></span>
      </a>
      <nav id="nav" aria-label="Hoofdnavigatie"></nav>
      <div class="sidebar-bottom">
        <button type="button" id="reset-control" data-action="reset">Demo herstellen</button>
        <div class="workspace"><span class="avatar" aria-hidden="true">DD</span><span><strong>De Driekleur</strong><small>Lokale werkruimte</small></span></div>
      </div>
    </aside>
    <button type="button" id="nav-overlay" aria-label="Navigatie sluiten" tabindex="-1"></button>
    <div class="shell-content">
      <header class="topbar">
        <div class="breadcrumbs"><button type="button" id="nav-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Navigatie openen"></button><span>Business Suite</span><span aria-hidden="true">/</span><strong id="breadcrumb">Dashboard</strong></div>
        <span class="demo-indicator"><i></i> Demo-omgeving</span>
      </header>
      <div id="main-content" tabindex="-1"></div>
      <main id="main"></main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form>
      <header class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Sluiten">×</button></header>
      <div class="dialog-body"><div data-body></div><p data-form-error role="alert" tabindex="-1"></p></div>
      <footer class="dialog-footer"><button type="button" class="button secondary" data-action="close-modal">Terug</button><button type="submit" class="button primary">Opslaan</button></footer>
    </form>
  </dialog>
  <div id="notice" class="toast" hidden><span role="status"></span><span role="alert"></span><button type="button" data-action="dismiss-notice" aria-label="Melding sluiten">×</button></div>
</body>
</html>
